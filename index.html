<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Plan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0B6B5D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money Plan">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#12201B;background:#EEF2F0}
#app{max-width:1120px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 20px max(48px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:34px;line-height:1.1;letter-spacing:-.02em}h2{margin:0;font-size:21px}
p{margin:0}.muted{color:#44544E}.row{display:flex;flex-wrap:wrap;gap:12px}.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.in{font:inherit;font-size:16px;color:#12201B;background:#fff;border:1px solid #B9C7C1;border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.in:focus,.mini:focus{outline:2px solid #0B6B5D;outline-offset:1px}
.lab{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:#44544E;flex:1 1 140px;min-width:0}
.btn{font:inherit;font-size:15px;font-weight:700;color:#fff;background:#0B6B5D;border:0;border-radius:8px;min-height:44px;padding:0 20px;cursor:pointer}
.rm{font:inherit;font-size:13px;color:#44544E;background:none;border:1px solid #B9C7C1;border-radius:6px;min-height:36px;padding:0 12px;cursor:pointer;position:relative;display:inline-flex;align-items:center}
.rm:focus-within{outline:2px solid #0B6B5D;outline-offset:2px}
.mini{font:inherit;font-size:14px;background:#fff;border:1px solid #B9C7C1;border-radius:6px;padding:6px 8px;min-height:36px;width:110px}
.card{background:#fff;border:1px solid #D5DFDA;border-radius:14px;padding:22px}
.stat{flex:1 1 200px}.stat small{font-size:13px;color:#44544E}.stat b{display:block;font-size:26px;margin-top:6px}
.bar{height:8px;border-radius:4px;background:#DCE5E0}.bar i{display:block;height:100%;border-radius:4px}
.item{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid #E3EAE6}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.chk{width:22px;height:22px;accent-color:#0B6B5D;margin:0}
.file{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}.cols>div{flex:1 1 420px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='money-plan-v2',BASE_E=['Food','Rent and bills','Transport','Shopping','Health','Fun'],BASE_I=['Papa','Friend','Dividend','Refund','Gift'];
const ld=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const S={salary:'',other:'',month:ld().slice(0,7),expenses:[],goals:[],budgets:{},eDesc:'',eAmt:'',eCat:'Food',eDate:ld(),eRec:false,gName:'',gType:'Short-term',gPri:'Medium',gTarget:'',gSaved:'',gDate:'',gRate:'',pend:null,msg:'',cur:'INR',incomes:[],customExp:[],customInc:[],eCustom:'',iCat:'Papa',iCustom:'',iDesc:'',iAmt:'',iDate:ld(),iRec:false};
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d)Object.assign(S,{salary:d.salary||'',other:d.other||'',expenses:d.expenses||[],goals:d.goals||[],budgets:d.budgets||{},cur:d.cur||'INR',incomes:d.incomes||[],customExp:d.customExp||[],customInc:d.customInc||[]})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({salary:S.salary,other:S.other,expenses:S.expenses,goals:S.goals,budgets:S.budgets,cur:S.cur,incomes:S.incomes,customExp:S.customExp,customInc:S.customInc}))}catch(e){}};
const esc=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const CURS=[['INR','Indian rupee'],['USD','US dollar'],['EUR','Euro'],['GBP','British pound'],['AED','UAE dirham'],['SGD','Singapore dollar'],['AUD','Australian dollar'],['CAD','Canadian dollar'],['JPY','Japanese yen'],['CHF','Swiss franc']];
const loc=()=>S.cur==='INR'?'en-IN':'en-US';
const f=n=>{try{return new Intl.NumberFormat(loc(),{style:'currency',currency:S.cur,currencyDisplay:'narrowSymbol',minimumFractionDigits:0,maximumFractionDigits:0}).format(Math.round(n))}catch(e){return Math.round(n).toLocaleString()}};
const sym=()=>{try{return new Intl.NumberFormat('en-US',{style:'currency',currency:S.cur,currencyDisplay:'narrowSymbol'}).formatToParts(0).find(p=>p.type==='currency').value}catch(e){return S.cur}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ORD={High:0,Medium:1,Low:2};
const expCats=()=>[...BASE_E,...S.customExp,'Other'],incCats=()=>[...BASE_I,...S.customInc,'Other'];
function resolveCat(kind){
  const cat=S[kind+'Cat'],custom=S[kind+'Custom'].trim().slice(0,30);
  if(cat!=='Other'||!custom||custom.toLowerCase()==='other')return cat;
  const list=kind==='e'?S.customExp:S.customInc,all=kind==='e'?expCats():incCats();
  const found=all.find(c=>c.toLowerCase()===custom.toLowerCase());
  if(found)return found;
  list.push(custom);return custom;
}

function calc(){
  const rv=S.incomes.filter(e=>e.date.slice(0,7)===S.month||(e.rec&&e.date.slice(0,7)<=S.month)).sort((a,b)=>b.date.localeCompare(a.date));
  const recvTotal=rv.reduce((a,e)=>a+e.amt,0);
  const inc=(parseFloat(S.salary)||0)+(parseFloat(S.other)||0)+recvTotal;
  const ex=S.expenses.filter(e=>e.date.slice(0,7)===S.month||(e.rec&&e.date.slice(0,7)<=S.month)).sort((a,b)=>b.date.localeCompare(a.date));
  const spent=ex.reduce((a,e)=>a+e.amt,0);
  const now=new Date(),cy=now.getFullYear(),cm=now.getMonth();
  const months=g=>g.date?Math.max(1,(+g.date.slice(0,4)-cy)*12+(+g.date.slice(5,7)-1-cm)):(g.months||1);
  const pay=(g,n)=>{const sv=parseFloat(g.saved)||0,T=g.target,r=(parseFloat(g.rate)||0)/1200;
    if(sv>=T)return 0;if(!r)return(T-sv)/n;const k=Math.pow(1+r,n),need=T-sv*k;return need<=0?0:need*r/(k-1)};
  const goals=S.goals.map(g=>{const n=months(g);return{...g,n,per:pay(g,n)}}).sort((a,b)=>(ORD[a.pri]??1)-(ORD[b.pri]??1)||b.per-a.per);
  const need=goals.reduce((a,g)=>a+g.per,0);
  return{inc,ex,spent,goals,need,left:inc-spent-need,rv,recvTotal};
}

function view(){
  const{inc,ex,spent,goals,need,left,rv,recvTotal}=calc();
  const sum=t=>goals.filter(g=>g.type===t).reduce((a,g)=>a+g.per,0);
  const basis=Math.max(inc,spent+need,1),pc=x=>Math.max(0,x)/basis*100;
  const pi=x=>inc>0?Math.round(Math.max(0,x)/inc*100)+'% of income':f(Math.max(0,x));
  let verdict='Enter your income to see how your goals fit.',tip='';
  if(inc>0){verdict=left>=0?'On track: '+f(left)+' is left after spending and goal savings.':'Over by '+f(-left)+' a month.';
    if(left<0){const c=goals.filter(g=>g.per>0).sort((a,b)=>(ORD[b.pri]??1)-(ORD[a.pri]??1)||b.per-a.per)[0];
      tip=c?'Stretch the deadline of "'+c.name+'" ('+c.pri+' priority) first, or trim spending.':'Trim spending or raise income.'}}
  const tot=expCats().map(n=>({n,v:ex.filter(e=>e.cat===n).reduce((a,e)=>a+e.amt,0)}));
  const mx=Math.max(1,...tot.map(t=>t.v));
  const opt=(list,sel)=>list.map(o=>`<option value="${esc(o)}"${o===sel?' selected':''}>${esc(o==='Other'?'Other (type your own)':o)}</option>`).join('');
  const inp=(k,type,val,extra='')=>`<input class="in" data-k="${k}" type="${type}" value="${esc(val)}" ${extra}>`;
  return `
<div class="row" style="align-items:flex-end;justify-content:space-between;gap:20px">
 <div style="flex:1 1 280px"><h1>Money plan</h1><p class="muted" style="margin-top:8px">Track spending, set goals, and see what to save each month from your income.</p></div>
 <div class="row" style="flex:1 1 460px;max-width:600px">
  <label class="lab">Monthly salary (${sym()})${inp('salary','number',S.salary,'min="0" inputmode="numeric" placeholder="e.g. 60000"')}</label>
  <label class="lab">Other income (${sym()})${inp('other','number',S.other,'min="0" inputmode="numeric" placeholder="Freelance, bonus"')}</label>
  <label class="lab">Month${inp('month','month',S.month)}</label>
  <label class="lab">Currency<select class="in" data-k="cur">${CURS.map(c=>`<option value="${c[0]}"${c[0]===S.cur?' selected':''}>${c[0]} - ${c[1]}</option>`).join('')}</select></label>
 </div>
</div>
<div class="row" style="gap:16px">
 <div class="card stat"><small>Total income</small><b>${f(inc)}</b></div>
 <div class="card stat"><small>Received this month</small><b style="color:#0B6B5D">${f(recvTotal)}</b></div>
 <div class="card stat"><small>Spent this month</small><b style="color:#B03A0A">${f(spent)}</b></div>
 <div class="card stat"><small>Goal savings needed / month</small><b style="color:#1E40AF">${f(need)}</b></div>
 <div class="card stat"><small>Left after spending + goals</small><b style="color:#0B6B5D">${f(left)}</b></div>
</div>
<div class="card col" style="gap:14px">
 <div style="font-size:18px;font-weight:700">${esc(verdict)}</div>
 ${tip?`<div class="muted">${esc(tip)}</div>`:''}
 <div style="display:flex;height:20px;border-radius:10px;overflow:hidden;background:#DCE5E0"><i style="width:${pc(spent)}%;background:#B03A0A"></i><i style="width:${pc(need)}%;background:#1E40AF"></i><i style="width:${pc(left)}%;background:#0B6B5D"></i></div>
 <div class="row muted" style="gap:20px;font-size:13px"><span>Spent: ${inc>0?Math.round(spent/inc*100)+'% of income':f(spent)}</span><span>Goals: ${inc>0?Math.round(need/inc*100)+'% of income':f(need)}</span><span>Free: ${pi(left)}</span></div>
 <div class="row" style="align-items:center">
  <button class="rm" data-a="export">Export backup (CSV)</button>
  <label class="rm">Import backup (CSV)<input class="file" type="file" accept=".csv,text/csv" data-a="import"></label>
 </div>
 ${S.pend?`<div class="row" style="align-items:center;background:#FFF4E5;border:1px solid #E6C27A;border-radius:10px;padding:12px 14px"><span style="flex:1 1 260px">Replace your current data with this backup (${S.pend.expenses.length} expenses, ${S.pend.incomes?S.pend.incomes.length+' received, ':''}${S.pend.goals.length} goals)?</span><button class="btn" data-a="applyImp">Replace data</button><button class="rm" data-a="cancelImp">Cancel</button></div>`:''}
 ${S.msg?`<div class="muted" style="font-size:14px">${esc(S.msg)}</div>`:''}
</div>
<div class="cols">
<div class="col" style="gap:20px">
 <div class="card col" style="gap:16px"><h2>Add an expense</h2>
  <div class="row">
   <label class="lab" style="flex-basis:200px">What for${inp('eDesc','text',S.eDesc,'placeholder="e.g. Groceries"')}</label>
   <label class="lab">Amount (${sym()})${inp('eAmt','number',S.eAmt,'min="0" inputmode="decimal"')}</label>
   <label class="lab">Category<select class="in" data-k="eCat">${opt(expCats(),S.eCat)}</select></label>
   ${S.eCat==='Other'?`<label class="lab" style="flex-basis:200px">New category name (optional)${inp('eCustom','text',S.eCustom,'maxlength="30" placeholder="e.g. Pets, Gifts"')}</label>`:''}
   <label class="lab">Date${inp('eDate','date',S.eDate)}</label>
  </div>
  <label style="display:flex;align-items:center;gap:10px;min-height:44px"><input class="chk" type="checkbox" data-k="eRec"${S.eRec?' checked':''}>Repeats every month (rent, EMI, subscription)</label>
  <div><button class="btn" data-a="addE">Add expense</button></div>
 </div>
 <div class="card col" style="gap:16px"><h2>Add money received</h2>
  <div class="row">
   <label class="lab" style="flex-basis:200px">From / what for${inp('iDesc','text',S.iDesc,'placeholder="e.g. Rent from tenant, gift"')}</label>
   <label class="lab">Category<select class="in" data-k="iCat">${opt(incCats(),S.iCat)}</select></label>
   ${S.iCat==='Other'?`<label class="lab" style="flex-basis:200px">New category name (optional)${inp('iCustom','text',S.iCustom,'maxlength="30" placeholder="e.g. Bonus, Prize"')}</label>`:''}
   <label class="lab">Amount (${sym()})${inp('iAmt','number',S.iAmt,'min="0" inputmode="decimal"')}</label>
   <label class="lab">Date${inp('iDate','date',S.iDate)}</label>
  </div>
  <label style="display:flex;align-items:center;gap:10px;min-height:44px"><input class="chk" type="checkbox" data-k="iRec"${S.iRec?' checked':''}>Repeats every month</label>
  <div><button class="btn" data-a="addI">Add money received</button></div>
 </div>
 <div class="card col" style="gap:4px"><h2 style="margin-bottom:8px">Money received this month</h2>
  ${rv.length?'':'<p class="muted">Nothing received for this month yet.</p>'}
  ${rv.map(e=>`<div class="item"><div style="flex:1 1 180px;min-width:0"><div style="font-weight:500">${esc(e.desc)}</div><div class="muted" style="font-size:13px">${esc(e.date)} · ${esc(e.cat||'Other')}${e.rec?' · repeats monthly':''}</div></div><b style="color:#0B6B5D">+${f(e.amt)}</b><button class="rm" data-a="rmI" data-id="${esc(e.id)}" aria-label="Remove entry">Remove</button></div>`).join('')}
 </div>
 <div class="card col" style="gap:14px"><h2>Category budgets</h2>
  ${tot.map(t=>{const b=parseFloat(S.budgets[t.n])||0,r=b>0?t.v/b:0;
   const col=b<=0?'#5B6B65':r>1?'#B91C1C':r>=.8?'#B45309':'#0B6B5D';
   const st=b<=0?'No budget set':r>1?'Over by '+f(t.v-b):f(b-t.v)+' left';
   return `<div class="col" style="gap:6px"><div class="row" style="justify-content:space-between;align-items:center"><span style="font-weight:500">${esc(t.n)}</span>
   <label class="muted" style="display:flex;align-items:center;gap:8px;font-size:13px">Budget ${sym()}<input class="mini" type="number" min="0" inputmode="numeric" placeholder="none" aria-label="Monthly budget for ${esc(t.n)}" data-k="b:${esc(t.n)}" value="${esc(S.budgets[t.n]||'')}"></label></div>
   <div class="bar"><i style="background:${col};width:${b>0?Math.min(100,r*100):t.v/mx*100}%"></i></div>
   <div class="row muted" style="justify-content:space-between;font-size:13px"><span>Spent ${f(t.v)}</span><b>${st}</b></div></div>`}).join('')}
 </div>
 <div class="card col" style="gap:4px"><h2 style="margin-bottom:8px">Expenses in this month</h2>
  ${ex.length?'':'<p class="muted">Nothing logged for this month yet.</p>'}
  ${ex.map(e=>`<div class="item"><div style="flex:1 1 180px;min-width:0"><div style="font-weight:500">${esc(e.desc)}</div><div class="muted" style="font-size:13px">${esc(e.date)} · ${esc(e.cat)}${e.rec?' · repeats monthly':''}</div></div><b>${f(e.amt)}</b><button class="rm" data-a="rmE" data-id="${esc(e.id)}" aria-label="Remove expense">Remove</button></div>`).join('')}
 </div>
</div>
<div class="col" style="gap:20px">
 <div class="card col" style="gap:16px"><h2>Add a goal</h2>
  <div class="row">
   <label class="lab" style="flex-basis:200px">Goal${inp('gName','text',S.gName,'placeholder="e.g. Emergency fund"')}</label>
   <label class="lab">Type<select class="in" data-k="gType">${opt(['Short-term','Long-term'],S.gType)}</select></label>
   <label class="lab">Priority<select class="in" data-k="gPri">${opt(['High','Medium','Low'],S.gPri)}</select></label>
   <label class="lab">Target (${sym()})${inp('gTarget','number',S.gTarget,'min="0" inputmode="numeric"')}</label>
   <label class="lab">Saved so far (${sym()})${inp('gSaved','number',S.gSaved,'min="0" inputmode="numeric" placeholder="0"')}</label>
   <label class="lab">Reach it by${inp('gDate','month',S.gDate)}</label>
   <label class="lab">Return % per year (optional)${inp('gRate','number',S.gRate,'min="0" step="0.5" inputmode="decimal" placeholder="e.g. 8"')}</label>
  </div>
  <div><button class="btn" data-a="addG">Add goal</button></div>
 </div>
 <div class="card col" style="gap:4px"><h2 style="margin-bottom:8px">Your goals</h2>
  <div class="row muted" style="gap:20px;font-size:14px;margin-bottom:8px"><span>Short-term: <b style="color:#12201B">${f(sum('Short-term'))}/mo</b></span><span>Long-term: <b style="color:#12201B">${f(sum('Long-term'))}/mo</b></span></div>
  ${goals.length?'':'<p class="muted">No goals yet. Add one to see how much to save each month.</p>'}
  ${goals.map(g=>{const sv=parseFloat(g.saved)||0,pr=Math.min(100,sv/g.target*100);
   return `<div class="col" style="gap:8px;padding:14px 0;border-top:1px solid #E3EAE6">
   <div class="row" style="justify-content:space-between;align-items:center;gap:8px"><b>${esc(g.name)}</b><span class="row" style="gap:6px"><span class="chip" style="color:#1E40AF;background:#E3EAFB">${esc(g.type)}</span><span class="chip" style="background:#E3EAE6">${esc(g.pri)} priority</span></span></div>
   <div class="muted" style="font-size:14px">${f(g.target)} in ${g.n} month${g.n>1?'s':''}${parseFloat(g.rate)>0?' at '+esc(g.rate)+'% a year':''}</div>
   <div class="bar"><i style="background:#1E40AF;width:${pr}%"></i></div>
   <div class="muted" style="font-size:13px">${f(sv)} saved (${Math.round(pr)}%)</div>
   <div class="row" style="align-items:center;justify-content:space-between">
    <div><span style="font-size:22px;font-weight:700;color:#0B6B5D">${f(g.per)}</span> <span class="muted" style="font-size:13px">per month · ${inc>0?Math.round(g.per/inc*100)+'% of income':'add income to compare'}</span></div>
    <div class="row" style="align-items:center;gap:8px"><label class="muted" style="display:flex;align-items:center;gap:6px;font-size:13px">Saved ${sym()}<input class="mini" type="number" min="0" inputmode="numeric" aria-label="Saved so far for ${esc(g.name)}" data-k="gs:${esc(g.id)}" value="${esc(g.saved||'')}"></label><button class="rm" data-a="rmG" data-id="${esc(g.id)}" aria-label="Remove goal">Remove</button></div>
   </div></div>`}).join('')}
 </div>
</div>
</div>`;
}

const app=document.getElementById('app');
function render(){
  const a=document.activeElement,k=a&&a.dataset&&a.dataset.k,keep=k&&app.contains(a)?a:null;
  let st=null,en=null;
  if(keep){try{st=keep.selectionStart;en=keep.selectionEnd}catch(e){}}
  app.innerHTML=view();
  if(keep){
    const n=[...app.querySelectorAll('[data-k]')].find(x=>x.dataset.k===k);
    if(n){
      n.replaceWith(keep);keep.focus();
      try{
        if(keep.type==='number'){const t=keep.value.length;keep.type='text';keep.setSelectionRange(t,t);keep.type='number'}
        else if(st!=null)keep.setSelectionRange(st,en);
      }catch(e){}
    }
  }
}

function parseCsv(t){
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows;
}
function buildBackup(text){
  const rows=parseCsv(text.charCodeAt(0)===0xFEFF?text.slice(1):text);
  const out={expenses:[],goals:[],budgets:{},salary:undefined,other:undefined,cur:undefined,incomes:null,cx:[],ci:[]};let sec='',seen=false,recvNew=false;
  const clean=(c,base,list)=>{c=(c||'').trim().slice(0,30);if(!c)return'Other';if(c!=='Other'&&!base.includes(c)&&!list.includes(c))list.push(c);return c};
  rows.forEach(r=>{
    if(r.every(x=>x===''))return;const h=r[0];
    if(r.slice(1).every(x=>x==='')&&(h==='Expenses'||h==='Goals'||h==='Settings'||h==='Received')){sec=h;seen=true;if(h==='Received')out.incomes=[];return}
    if(h==='Date'){if(sec==='Received')recvNew=r.includes('Category');return}
    if(h==='Goal')return;
    if(sec==='Expenses'){const amt=parseFloat(r[3]);
      if(/^\d{4}-\d{2}-\d{2}$/.test(r[0])&&amt>0)out.expenses.push({id:uid(),date:r[0],desc:r[1]||r[2],cat:clean(r[2],BASE_E,out.cx),amt,rec:r[4]==='yes'})}
    else if(sec==='Received'){const o=recvNew?1:0,amt=parseFloat(r[2+o]);
      if(/^\d{4}-\d{2}-\d{2}$/.test(r[0])&&amt>0)out.incomes.push({id:uid(),date:r[0],desc:r[1]||'Money received',cat:recvNew?clean(r[2],BASE_I,out.ci):'Other',amt,rec:r[3+o]==='yes'})}
    else if(sec==='Goals'){const target=parseFloat(r[3]);
      if(target>0&&/^\d{4}-\d{2}$/.test(r[5]))out.goals.push({id:uid(),name:r[0]||'Untitled goal',type:r[1]==='Long-term'?'Long-term':'Short-term',pri:['High','Medium','Low'].includes(r[2])?r[2]:'Medium',target,saved:r[4]||'',date:r[5],rate:r[6]&&r[6]!=='0'?r[6]:''})}
    else if(sec==='Settings'){
      if(h==='Salary')out.salary=r[1]||'';else if(h==='Other income')out.other=r[1]||'';
      else if(h==='Currency'&&CURS.some(c=>c[0]===r[1]))out.cur=r[1];else if(h==='Budget'&&r[1])out.budgets[r[1]]=r[2]||'';else if(h==='Custom expense category'&&r[1]&&!out.cx.includes(r[1]))out.cx.push(r[1]);else if(h==='Custom income category'&&r[1]&&!out.ci.includes(r[1]))out.ci.push(r[1])}
  });
  return seen?out:null;
}
function exportCsv(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const{goals}=calc();
  const rows=[['Expenses'],['Date','Description','Category','Amount','Repeats monthly']];
  S.expenses.forEach(e=>rows.push([e.date,e.desc,e.cat,e.amt,e.rec?'yes':'no']));
  rows.push([],['Received'],['Date','From','Category','Amount','Repeats monthly']);
  S.incomes.forEach(e=>rows.push([e.date,e.desc,e.cat||'Other',e.amt,e.rec?'yes':'no']));
  rows.push([],['Goals'],['Goal','Type','Priority','Target','Saved so far','Reach by','Return % per year','Save per month']);
  goals.forEach(g=>rows.push([g.name,g.type,g.pri,g.target,parseFloat(g.saved)||0,g.date||'',parseFloat(g.rate)||0,Math.round(g.per)]));
  rows.push([],['Settings'],['Salary',S.salary],['Other income',S.other],['Currency',S.cur]);
  expCats().forEach(n=>rows.push(['Budget',n,S.budgets[n]||'']));
  S.customExp.forEach(n=>rows.push(['Custom expense category',n]));
  S.customInc.forEach(n=>rows.push(['Custom income category',n]));
  const csv=rows.map(r=>r.map(q).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='money-plan-'+ld()+'.csv';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

app.addEventListener('input',e=>{
  const el=e.target,k=el.dataset.k;if(!k)return;
  const v=el.type==='checkbox'?el.checked:el.value;
  if(k.startsWith('b:'))S.budgets[k.slice(2)]=v;
  else if(k.startsWith('gs:')){const g=S.goals.find(x=>String(x.id)===k.slice(3));if(g)g.saved=v}
  else if(k==='month'){if(v)S.month=v}
  else S[k]=v;
  save();render();
});
app.addEventListener('change',e=>{
  const el=e.target;if(el.dataset.a!=='import')return;
  const file=el.files&&el.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{const d=buildBackup(String(rd.result));
    S.pend=d;S.msg=d?'':'That file does not look like a backup from this app.';render()};
  rd.onerror=()=>{S.msg='Could not read that file.';render()};
  rd.readAsText(file);
});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='addE'){const amt=parseFloat(S.eAmt);if(!(amt>0)||!S.eDate)return;
    const cat=resolveCat('e');S.expenses.push({id:uid(),desc:S.eDesc.trim()||cat,amt,cat,date:S.eDate,rec:S.eRec});
    S.month=S.eDate.slice(0,7);S.eDesc='';S.eAmt='';S.eRec=false;S.eCat=cat;S.eCustom='';S.msg=''}
  else if(a==='addG'){const target=parseFloat(S.gTarget);if(!(target>0)||!S.gDate)return;
    S.goals.push({id:uid(),name:S.gName.trim()||'Untitled goal',type:S.gType,pri:S.gPri,target,saved:S.gSaved,date:S.gDate,rate:S.gRate});
    S.gName='';S.gTarget='';S.gSaved='';S.gDate='';S.gRate='';S.msg=''}
  else if(a==='addI'){const amt=parseFloat(S.iAmt);if(!(amt>0)||!S.iDate)return;
    const cat=resolveCat('i');S.incomes.push({id:uid(),desc:S.iDesc.trim()||cat,cat,amt,date:S.iDate,rec:S.iRec});
    S.month=S.iDate.slice(0,7);S.iDesc='';S.iAmt='';S.iRec=false;S.iCat=cat;S.iCustom='';S.msg=''}
  else if(a==='rmI')S.incomes=S.incomes.filter(x=>String(x.id)!==id);
  else if(a==='rmE')S.expenses=S.expenses.filter(x=>String(x.id)!==id);
  else if(a==='rmG')S.goals=S.goals.filter(x=>String(x.id)!==id);
  else if(a==='export'){exportCsv();return}
  else if(a==='applyImp'){const d=S.pend;if(!d)return;
    S.expenses=d.expenses;if(d.incomes)S.incomes=d.incomes;S.customExp=[...new Set([...S.customExp,...d.cx])];S.customInc=[...new Set([...S.customInc,...d.ci])];S.goals=d.goals;S.budgets=d.budgets;
    if(d.salary!==undefined)S.salary=d.salary;if(d.other!==undefined)S.other=d.other;if(d.cur)S.cur=d.cur;
    S.pend=null;S.msg='Backup restored.'}
  else if(a==='cancelImp')S.pend=null;
  else return;
  save();render();
});

render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
